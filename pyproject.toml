[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "webcreoling"
version = "0.1.0"
description = "End-to-End Bangla News Web Scraping, SQLite Storage, CPU-optimized LLM Training with Hybrid LoRA Fine-Tuning and RAG Chat Interface"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "lxml>=5.0.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0.1",
    "torch>=2.2.0",
    "transformers>=4.40.0",
    "datasets>=2.19.0",
    "accelerate>=0.29.0",
    "peft>=0.10.0",
    "evaluate>=0.4.1",
    "rouge-score>=0.1.2",
    "nltk>=3.8.1",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pytest>=8.0.0",
    "pillow>=10.2.0",
    "pymysql>=1.2.3",
    "cryptography>=50.0.1",
]

[project.optional-dependencies]
selenium = [
    "selenium>=4.20.0",
    "webdriver-manager>=4.0.0",
]
llama-cpp = [
    "llama-cpp-python>=0.2.70",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
webcreoling = "src.cli:app"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
