<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.5" opacity="0.3"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="url(#bgGrad)" />
  <rect width="800" height="450" fill="url(#grid)" />
  <circle cx="400" cy="180" r="70" fill="#1e293b" stroke="#334155" stroke-width="2" opacity="0.8" />
  <text x="400" y="195" font-family="'Noto Serif Bengali', 'Segoe UI', sans-serif" font-size="48" fill="#f8fafc" text-anchor="middle">📰</text>
  <rect x="250" y="275" width="300" height="6" rx="3" fill="url(#accentGrad)" />
  <text x="400" y="320" font-family="'Noto Serif Bengali', 'Hind Siliguri', 'Segoe UI', sans-serif" font-weight="bold" font-size="28" fill="#ffffff" text-anchor="middle" letter-spacing="1">The Daily AI Alo</text>
  <text x="400" y="355" font-family="'Noto Serif Bengali', 'Hind Siliguri', 'Segoe UI', sans-serif" font-size="18" fill="#94a3b8" text-anchor="middle">দি ডেইলি এআই আলো • বস্তুনিষ্ঠ ও নির্ভীক সংবাদ</text>
</svg>
