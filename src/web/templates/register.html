{% extends "base.html" %}

{% block title %}Register - WebCreoling{% endblock %}

{% block content %}
<div style="max-width: 480px; margin: 3rem auto;">
    <div class="card" style="box-shadow: var(--shadow-lg);">
        <div style="text-align: center; margin-bottom: 2rem;">
            <h2 style="font-size: 1.6rem; font-weight: 700; margin-bottom: 0.5rem;">Create an Account</h2>
            <p style="color: var(--text-secondary); font-size: 0.9rem;">Join the Bangla News Intelligence Platform</p>
        </div>

        <form method="POST" action="{{ url_for('auth.register_view') }}">
            <div class="form-group">
                <label class="form-label">Username</label>
                <input type="text" name="username" class="form-control" placeholder="john_doe" required autofocus>
            </div>

            <div class="form-group">
                <label class="form-label">Email Address</label>
                <input type="email" name="email" class="form-control" placeholder="john@example.com" required>
            </div>

            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>

            <div class="form-group">
                <label class="form-label">Requested Role</label>
                <select name="role" class="form-control">
                    <option value="viewer">Viewer (Read-only access)</option>
                    <option value="analyst">Analyst (AI Chat, RAG, and Task execution)</option>
                    <option value="editor">Editor (Scraper Control & Article Tools)</option>
                </select>
                <small style="color: var(--text-muted); font-size: 0.75rem; display: block; margin-top: 0.3rem;">
                    *Admin role can only be assigned by existing administrators.
                </small>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem; padding: 0.75rem;">
                Create Account
            </button>
        </form>

        <div style="margin-top: 1.5rem; text-align: center; font-size: 0.9rem; color: var(--text-secondary);">
            Already have an account? <a href="{{ url_for('auth.login_view') }}" style="color: var(--accent-primary);">Sign In</a>
        </div>
    </div>
</div>
{% endblock %}
